<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trend - Sliding Window</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="graph.css">
</head>
<body>
    <main class="card card--wide">
        <h1>Live Current Trend</h1>
        <p id="statusText" class="status status--off">Idle</p>

        <!-- Current weather. The panel only moves in good weather, so this
             makes it obvious why the current stays flat when it's bad. -->
        <div id="weatherCard" class="weather">
            <img id="weatherIcon" class="weather__icon" alt="" hidden>
            <div class="weather__body">
                <div id="weatherTemp" class="weather__temp">--</div>
                <div id="weatherDesc" class="weather__desc">Loading weather...</div>
            </div>
            <div id="weatherBadge" class="weather__badge"></div>
        </div>

        <!-- Current reading -->
        <div id="currentValue" class="angle-value">--</div>
        <div class="unit-label">mA</div>

        <!-- Chart -->
        <div class="chart-wrap">
            <canvas id="chart" width="760" height="320"></canvas>
        </div>

        <!-- Live stats -->
        <div class="stats">
            <div class="stat"><span class="stat__label">Min</span><span id="statMin" class="stat__val">--</span></div>
            <div class="stat"><span class="stat__label">Max</span><span id="statMax" class="stat__val">--</span></div>
            <div class="stat"><span class="stat__label">Avg</span><span id="statAvg" class="stat__val">--</span></div>
            <div class="stat"><span class="stat__label">Points</span><span id="statCount" class="stat__val">0</span></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="controls-row">
                <label class="field field--sm">
                    <span class="field__label">Poll (ms)</span>
                    <input id="intervalInput" class="field__input" type="number" min="100" step="100" value="1000">
                </label>
                <label class="field field--sm">
                    <span class="field__label">Window (points)</span>
                    <input id="windowInput" class="field__input" type="number" min="5" step="5" value="60">
                </label>
            </div>

            <div class="presets">
                <button id="startBtn" class="preset preset--primary">Start</button>
                <button id="stopBtn" class="preset" disabled>Stop</button>
                <button id="clearBtn" class="preset">Clear</button>
            </div>
        </div>

        <p style="margin-top:24px;">
            <a class="back-link" href="index.html">&larr; Camera Stream</a>
            <a class="back-link" href="servo.html">Servo &rarr;</a>
        </p>
    </main>

    <script src="graph.js"></script>
</body>
</html>
