<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Phone Camera Stream</title>
    <!-- Arduino WebUI client library (local). socket.io MUST load first,
         then arduino.js which defines the WebUI class on top of it. -->
    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <!-- QRCode library, bundled locally so it works with no internet on the board -->
    <script src="libs/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: #fff; }
        #qrCodeContainer { margin: 20px auto; background: white; padding: 10px; width: 128px; height: 128px; border-radius: 8px; }
        .hidden { display: none; }
        #cameraFeed { border: none; border-radius: 8px; max-width: 90vw; height: auto; background: #000; }
    </style>
</head>
<body>

    <h1>Arduino Phone Camera Stream</h1>
    <p id="statusText">Waiting for connection...</p>

    <p>
        <a href="servo.html" style="display:inline-block;padding:10px 18px;background:#16A588;color:#fff;text-decoration:none;border-radius:10px;font-size:0.95rem;">
            Servo Control &rarr;
        </a>
    </p>

    <!-- QR Code / Secret Section (Shown when disconnected) -->
    <div id="pairingSection">
        <div id="qrCodeContainer"></div>
        <p id="qrSecretText" style="font-family: monospace; font-size: 1.2em; color: #16A588;"></p>
        <p style="font-size: 0.9em; color: #aaa;">Scan the QR code or enter the secret in the Arduino companion app.</p>
    </div>

    <!-- Live Stream Video Frame (Shown when streaming) -->
    <div id="streamSection" class="hidden">
        <img id="cameraFeed" width="640" height="480" alt="Live camera feed">
    </div>

    <!-- Recent detections -->
    <div id="detectionsSection">
        <h3 style="color:#16A588;">Detections</h3>
        <ul id="detectionsList" style="list-style:none;padding:0;max-width:480px;margin:0 auto;text-align:left;"></ul>
    </div>

    <script>
        const ui = new WebUI();
        let webcamState = { clientName: '', status: 'disconnected', secret: null, protocol: '', ip: '', port: 0 };

        // The processed camera feed (with detection overlays) is served as an
        // MJPEG stream at /camera on the same origin that serves this page.
        const streamUrl = `${window.location.origin}/camera`;

        // Start / stop the <img> MJPEG stream. Clearing src closes the HTTP
        // connection so the board isn't streaming to a hidden element.
        function startStream() {
            const img = document.getElementById('cameraFeed');
            // Cache-bust so a reconnect always opens a fresh stream.
            img.src = `${streamUrl}?t=${Date.now()}`;
        }
        function stopStream() {
            const img = document.getElementById('cameraFeed');
            img.removeAttribute('src');
        }

        // Pairing payload from the backend
        ui.on_message('welcome', (message) => {
            if (message.status !== 'disconnected') {
                webcamState.clientName = message.client_name;
            }
            webcamState.status = message.status;
            webcamState.secret = message.secret;
            webcamState.protocol = message.protocol;
            webcamState.ip = message.ip;
            webcamState.port = message.port;
            updateDisplay();
        });

        // Status events relayed from camera.on_status_changed on the backend
        ui.on_message('connected', (message) => {
            webcamState.status = 'connected';
            webcamState.clientName = (message && message.client_name) || webcamState.clientName;
            updateDisplay();
        });

        ui.on_message('streaming', () => {
            webcamState.status = 'streaming';
            updateDisplay();
        });

        ui.on_message('paused', () => {
            webcamState.status = 'paused';
            updateDisplay();
        });

        ui.on_message('disconnected', () => {
            webcamState.status = 'disconnected';
            webcamState.clientName = '';
            updateDisplay();
        });

        // Detections pushed from the backend's on_detect_all callback
        const MAX_DETECTIONS = 10;
        ui.on_message('detection', (d) => {
            const list = document.getElementById('detectionsList');
            const li = document.createElement('li');
            li.style.cssText = 'padding:6px 10px;margin:4px 0;background:#1e1e1e;border-radius:6px;';
            const pct = d.confidence != null ? ` (${(d.confidence * 100).toFixed(1)}%)` : '';
            const time = d.timestamp ? new Date(d.timestamp).toLocaleTimeString() : '';
            li.textContent = `${d.content}${pct}  ${time}`;
            list.prepend(li);
            while (list.children.length > MAX_DETECTIONS) list.removeChild(list.lastChild);
        });

        function updateDisplay() {
            const pairingSection = document.getElementById('pairingSection');
            const streamSection = document.getElementById('streamSection');
            const statusText = document.getElementById('statusText');

            if (webcamState.status === 'streaming') {
                pairingSection.classList.add('hidden');
                streamSection.classList.remove('hidden');
                statusText.textContent = `${webcamState.clientName || 'Camera'} connected & streaming!`;
                startStream();
            } else {
                pairingSection.classList.remove('hidden');
                streamSection.classList.add('hidden');
                stopStream();
                statusText.textContent = webcamState.status === 'connected'
                    ? "Phone connected, waiting for stream..."
                    : "Pair your phone using the code below:";

                if (webcamState.secret) {
                    generateQRCode(webcamState.secret, webcamState.protocol, webcamState.ip, webcamState.port);
                }
            }
        }

        function generateQRCode(secret, protocol, ip, port) {
            const container = document.getElementById('qrCodeContainer');
            container.innerHTML = '';
            new QRCode(container, {
                text: `https://cloud.arduino.cc/installmobileapp?otp=${secret}&protocol=${protocol}&ip=${ip}&port=${port}`,
                width: 128,
                height: 128,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.L
            });
            document.getElementById('qrSecretText').textContent = `Password: ${secret}`;
        }
    </script>
</body>
</html>
